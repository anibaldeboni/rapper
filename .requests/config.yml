request:
  method: PUT
  url_template: https://api.myapp.io/users/{{.id}}
  body_template: |
    {
      "address": {
        "street": "{{.street_name}}",
        "number": "{{.house_number}}",
        "city": "{{.city}}"
      }
    }
  headers:
    Authorization: "Bearer JWT of your application"
    Content-Type: application/json
csv:
  separator: ','
workers: 1
